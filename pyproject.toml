[project]
name = "mostt-model-builder"
version = "0.1.0"
description = "Reproducible, confined builds of speech recognition models from their original weights: export, quantization and FLEURS verification."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
    "import-linter==2.15",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

# The project is never distributed as a package, so it needs no build backend;
# and no package is ever built from its source on the host, where its build
# code would run outside a container.
[tool.uv]
package = false
no-build = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PT", "ARG", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.importlinter]
root_package = "mostt_model_builder"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inward: the host's composition root, then the adapters, the application and the domain"
type = "layers"
containers = ["mostt_model_builder"]
layers = ["(host_main)", "(adapters)", "(application)", "(domain)"]

[[tool.importlinter.contracts]]
name = "The bootstrap imports nothing of the packages, since it runs before they are on the path"
type = "forbidden"
source_modules = ["mostt_model_builder.bootstrap"]
forbidden_modules = ["mostt_model_builder.*"]

[[tool.importlinter.contracts]]
name = "The domain is pure: no other layer, and no module of the standard library that reaches the outside world"
type = "forbidden"
source_modules = ["mostt_model_builder.domain"]
forbidden_modules = [
    "mostt_model_builder.application",
    "mostt_model_builder.adapters",
    "mostt_model_builder.steps",
    "mostt_model_builder.host_main",
    "mostt_model_builder.bootstrap",
    "subprocess",
    "socket",
    "urllib",
    "http",
    "shutil",
    "tempfile",
    "asyncio",
]

[[tool.importlinter.contracts]]
name = "The application reaches the outside world only through its ports"
type = "forbidden"
source_modules = ["mostt_model_builder.application"]
forbidden_modules = [
    "mostt_model_builder.adapters",
    "mostt_model_builder.steps",
    "mostt_model_builder.host_main",
    "mostt_model_builder.bootstrap",
]

[[tool.importlinter.contracts]]
name = "The adapters are wired only by a composition root"
type = "forbidden"
source_modules = ["mostt_model_builder.adapters"]
forbidden_modules = [
    "mostt_model_builder.steps",
    "mostt_model_builder.host_main",
    "mostt_model_builder.bootstrap",
]
