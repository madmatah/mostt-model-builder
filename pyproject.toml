[project]
name = "mostt-model-builder"
version = "0.1.0"
description = "Reproducible, confined builds of speech recognition models from their original weights: export, quantization and FLEURS verification."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
    "import-linter==2.15",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

# The project is never distributed as a package, so it needs no build backend;
# and no package is ever built from its source on the host, where its build
# code would run outside a container.
[tool.uv]
package = false
no-build = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "recipes/parakeet-tdt/src", "recipes/parakeet-tdt/tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PT", "ARG", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests", "recipes/parakeet-tdt/src", "recipes/parakeet-tdt/tests"]
mypy_path = ["src", "recipes/parakeet-tdt/src"]

# The libraries of the steps are installed in their images alone, never on the host, where mypy
# runs: a step uses them untyped, through composition, never through a subclass of their classes.
[[tool.mypy.overrides]]
module = [
    "nemo",
    "nemo.*",
    "numpy",
    "numpy.*",
    "omegaconf",
    "omegaconf.*",
    "onnx",
    "onnx.*",
    "onnx_asr",
    "onnx_asr.*",
    "onnx_ir",
    "onnx_ir.*",
    "onnxruntime",
    "onnxruntime.*",
    "onnxscript",
    "onnxscript.*",
    "safetensors",
    "safetensors.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests", "recipes/parakeet-tdt/tests"]
pythonpath = ["src", "recipes/parakeet-tdt/src"]
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.importlinter]
root_packages = ["mostt_model_builder", "mostt_recipe_parakeet_tdt"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inward: the host's composition root, then the adapters, the application and the domain"
type = "layers"
containers = ["mostt_model_builder"]
layers = ["(host_main)", "(adapters)", "(application)", "(domain)"]

[[tool.importlinter.contracts]]
name = "The bootstrap imports nothing of the packages, since it runs before they are on the path"
type = "forbidden"
source_modules = ["mostt_model_builder.bootstrap"]
forbidden_modules = ["mostt_model_builder.*", "mostt_recipe_parakeet_tdt"]

[[tool.importlinter.contracts]]
name = "The domain is pure: no other layer, and no module of the standard library that reaches the outside world"
type = "forbidden"
source_modules = ["mostt_model_builder.domain"]
forbidden_modules = [
    "mostt_model_builder.application",
    "mostt_model_builder.adapters",
    "mostt_model_builder.steps",
    "mostt_model_builder.host_main",
    "mostt_model_builder.bootstrap",
    "mostt_recipe_parakeet_tdt",
    "subprocess",
    "socket",
    "urllib",
    "http",
    "shutil",
    "tempfile",
    "asyncio",
]

[[tool.importlinter.contracts]]
name = "The application reaches the outside world only through its ports"
type = "forbidden"
source_modules = ["mostt_model_builder.application"]
forbidden_modules = [
    "mostt_model_builder.adapters",
    "mostt_model_builder.steps",
    "mostt_model_builder.host_main",
    "mostt_model_builder.bootstrap",
    "mostt_recipe_parakeet_tdt",
]

[[tool.importlinter.contracts]]
name = "The adapters are wired only by a composition root"
type = "forbidden"
source_modules = ["mostt_model_builder.adapters"]
forbidden_modules = [
    "mostt_model_builder.steps",
    "mostt_model_builder.host_main",
    "mostt_model_builder.bootstrap",
    "mostt_recipe_parakeet_tdt",
]

[[tool.importlinter.contracts]]
name = "A container step runs on the core's domain and the shared step modules alone"
type = "forbidden"
source_modules = ["mostt_model_builder.steps"]
forbidden_modules = [
    "mostt_model_builder.application",
    "mostt_model_builder.adapters",
    "mostt_model_builder.host_main",
    "mostt_model_builder.bootstrap",
    "mostt_recipe_parakeet_tdt",
]

[[tool.importlinter.contracts]]
name = "The host never imports a container step, which runs only in its container"
type = "forbidden"
source_modules = ["mostt_model_builder.host_main"]
forbidden_modules = ["mostt_model_builder.steps", "mostt_recipe_parakeet_tdt.steps"]

[[tool.importlinter.contracts]]
name = "A recipe's domain and its contract are pure: the core's domain alone, and no module of the standard library that reaches the outside world"
type = "forbidden"
source_modules = ["mostt_recipe_parakeet_tdt.domain", "mostt_recipe_parakeet_tdt.recipe"]
forbidden_modules = [
    "mostt_model_builder.application",
    "mostt_model_builder.adapters",
    "mostt_model_builder.steps",
    "mostt_model_builder.host_main",
    "mostt_model_builder.bootstrap",
    "mostt_recipe_parakeet_tdt.steps",
    "subprocess",
    "socket",
    "urllib",
    "http",
    "shutil",
    "tempfile",
    "asyncio",
]

[[tool.importlinter.contracts]]
name = "A recipe's container step runs on its own domain, the core's domain and the core's shared step modules alone"
type = "forbidden"
source_modules = ["mostt_recipe_parakeet_tdt.steps"]
forbidden_modules = [
    "mostt_model_builder.application",
    "mostt_model_builder.adapters",
    "mostt_model_builder.host_main",
    "mostt_model_builder.bootstrap",
    "mostt_model_builder.steps.fleurs_check",
    "mostt_model_builder.steps.clean_output",
    "mostt_model_builder.steps.lock_resolution",
    "mostt_model_builder.steps.onnx_inspection",
]

[[tool.importlinter.contracts]]
name = "The libraries of the models load only in the steps that need them, never on the host"
type = "forbidden"
source_modules = [
    "mostt_model_builder.bootstrap",
    "mostt_model_builder.host_main",
    "mostt_model_builder.adapters",
    "mostt_model_builder.application",
    "mostt_model_builder.domain",
    "mostt_model_builder.steps.fleurs_audio",
    "mostt_model_builder.steps.fleurs_check",
    "mostt_model_builder.steps.clean_output",
    "mostt_model_builder.steps.output_modes",
    "mostt_model_builder.steps.control_group_peaks",
    "mostt_model_builder.steps.lock_resolution",
    "mostt_model_builder.steps.bound_sources",
    "mostt_recipe_parakeet_tdt.domain",
    "mostt_recipe_parakeet_tdt.recipe",
]
forbidden_modules = [
    "torch",
    "nemo",
    "transformers",
    "onnx",
    "onnxscript",
    "onnx_ir",
    "onnxruntime",
    "onnxconverter_common",
    "ml_dtypes",
    "onnx_asr",
    "numpy",
    "safetensors",
    "huggingface_hub",
    "librosa",
    "omegaconf",
]
