# The images' environment: the libraries of every image of the build, one extra per image that
# installs any, so that one lock pins one version of each library across a build. It is not a
# module and builds nothing. Only `./model-build.sh lock` resolves its lock, in a container, and
# only an image's build installs from it; uv never runs here on the host.
[project]
name = "mostt-model-builder-images"
version = "0.1.0"
description = "The libraries of the images of mostt-model-builder's build."
requires-python = "==3.12.*"
dependencies = []

[project.optional-dependencies]
core-onnx-inspect = ["onnx==1.23.2"]
parakeet-tdt-export = [
    "nemo-toolkit[asr]==3.0.0",
    "numpy==2.5.4",
    "onnx==1.23.2",
    "onnx-ir==1.1.0",
    "onnxruntime==1.31.0",
    "onnxscript==0.7.2",
    "safetensors==0.8.0",
    "torch==2.15.0",
]
parakeet-tdt-transcribe-cpu = ["numpy==2.5.4", "onnx-asr==0.12.0", "onnxruntime==1.31.0"]
parakeet-tdt-transcribe-gpu = [
    "numpy==2.5.4",
    "onnx-asr==0.12.0",
    "onnxruntime-gpu[cuda,cudnn]==1.31.0",
]

# A package published as an sdist alone, which uv refuses under no-build = true even with its
# dependency metadata declared, is built in a build stage of its image, without network.
# required-version makes every other version of uv refuse this project rather than resolve or
# build here; exclude-newer holds the transitive dependencies to what the build measured.
[tool.uv]
package = false
no-build = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
exclude-newer = "2026-11-02T16:10:00Z"
required-version = "==0.13.7"
# onnxruntime-gpu installs the same onnxruntime package as onnxruntime, so no image installs both.
conflicts = [
    [{ extra = "parakeet-tdt-transcribe-gpu" }, { extra = "parakeet-tdt-export" }],
    [{ extra = "parakeet-tdt-transcribe-gpu" }, { extra = "parakeet-tdt-transcribe-cpu" }],
]

# antlr4-python3-runtime, which hydra-core and omegaconf pin for NeMo, is published as an sdist
# alone: declaring its metadata lets a resolution skip building it, and the export image builds
# it in a stage of its own, without network.
[[tool.uv.dependency-metadata]]
name = "antlr4-python3-runtime"
version = "4.9.3"
requires-dist = []
